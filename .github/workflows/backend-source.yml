name: Backend Source

on:
  pull_request:
  push:
    branches: [ 'main' ]

jobs:
  formatting:
    name: Formatting Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Spotless (formating check)
        run: ./gradlew backend:spotlessCheck
