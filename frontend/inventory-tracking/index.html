<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Inventar-Verleih</title>
  <link rel="icon" href="../favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="cooling-packs.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div id="center">
  <!-- Admin Panel content goes here, initially hidden -->
  <div id="adminContent" style="display:none;">
    <!-- User Administration Box -->
    <div id="coolingpackAdminContent">
      <!-- User administration will be dynamically loaded here -->
    </div>
  </div>

  <!-- Password Modal -->
  <div id="passwordModal" class="modal">
    <div class="modal-content">
      <p>Bitte gib das Passwort ein, um die Inventar-Verleih-Seite aufzurufen:</p>

      <div class="input-group">
        <input required type="password" name="text" autocomplete="off" class="input" id="adminPassword">
        <label class="user-label">Passwort eingeben</label>
      </div>

      <button id="submitPasswordButton"  class="button">Bestätigen</button>
      <p id="passwordErrorMessage" style="color:#AE2805; display:none;">Es gab einen Fehler bei der API request.</p>
    </div>
  </div>
</div>
</body>
</html>
