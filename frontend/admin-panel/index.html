<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Admin panel</title>
        <link rel="icon" href="../resources/images/favicon.png">

        <link rel="stylesheet" href="../resources/stylesheets/general.css">
        <link rel="stylesheet" href="../resources/stylesheets/box.css">
        <link rel="stylesheet" href="../resources/stylesheets/modal.css">
        <link rel="stylesheet" href="../resources/stylesheets/select.css">
        <link rel="stylesheet" href="../resources/stylesheets/button.css">
        <link rel="stylesheet" href="../resources/stylesheets/input.css">
        <link rel="stylesheet" href="style.css">

        <script src="../resources/scripts/apiUrls.js"></script>
        <script src="../resources/scripts/modal.js"></script>
        <script src="../resources/scripts/timetable.js"></script>
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1 id="headerText">Admin panel</h1>

        <div style="display: flex" id="modal" class="modal">
            <div id="modalContent" class="box"><!--used to display info or error messages--></div>
        </div>

        <div style="display: none" id="messageBox" class="box">
            <h1>Alarmierungsnachricht</h1>
            <div id="messageDetails"><!--message plus options get inserted here--></div>
        </div>
        <div class="box">
            <h1>Inventar</h1>
            <div id="itemContainer" style="padding: 0.5em;"><!-- Items get inserted here --></div>
            <div class="box detailsBox">
                <p class="description">Neuer Gegenstand:</p>
                <div class="input-group">
                    <input required type="text" name="text" autocomplete="off" id="newItemName" class="input" placeholder>
                    <label class="user-label">Name</label>
                </div>
                <label class="checkbox-container elementUnderInput" id="showMaxFrontDistanceToggleDiv">
                    <input class="custom-checkbox" checked="" type="checkbox" id="showMaxFrontDistanceToggle">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Maximale Ausleihdauer hinzufügen</span>
                </label>
                <div class="input-group" id="maxLendingDurationInputBox" >
                    <input min="1" max="365" required type="number" name="text" autocomplete="off" id="maxLendingDurationInput" class="input" placeholder>
                    <label class="user-label">Max. Ausleihdauer (in Tagen)</label>
                </div>
                <button id="addItemButton" class="button elementUnderInput">Gegenstand hinzufügen</button>
            </div>
        </div>

        <!-- NOT REFACTORED -->

        <div id="userBox" class="box"><!--users get inserted here--></div>

        <div id="adminContent" style="display:none;">
            <!-- Message Box will be inserted here -->




            <!-- Duty Groups Management Box -->
            <div id="dutyGroupsBox" class="user-box">
                <h1>Duty Groups Management</h1><hr class="big-separator">
                <div id="dutyGroupsContainer">
                    <!-- Duty groups will be dynamically loaded here -->
                </div>

                <!-- Add Duty Group Button and Modal -->
                <button id="addDutyGroupButton">Add Duty Group</button>

                <div id="addDutyGroupModal" class="modal" style="display: none;">
                    <div class="modal-content">
                        <h2>Add Duty Group</h2>
                        <p>Select members for the duty group:</p>
                        <select id="userSelect" multiple size="5" style="width: 90%;"></select>

                        <p>Select duty days:</p>
                        <div id="dutyDaysSelect">
                            <label>Monday <input type="checkbox" value="Monday"></label>
                            <label>Tuesday<input type="checkbox" value="Tuesday"></label>
                            <label>Wednesday<input type="checkbox" value="Wednesday"></label>
                            <label>Thursday<input type="checkbox" value="Thursday"></label>
                            <label>Friday<input type="checkbox" value="Friday"></label>
                        </div>

                        <p>Set Duty Times:</p>
                        <label>Start Time: <input type="time" id="dutyStartTime"></label>
                        <label>End Time: <input type="time" id="dutyEndTime"></label>
                        <label>Friday End Time (Optional): <input type="time" id="fridayDutyEndTime"></label>

                        <button id="cancelAddDutyGroupButton">Cancel</button>
                        <button id="confirmAddDutyGroupButton">Confirm</button>
                    </div>
                </div>
            </div>

            <!-- User Administration Box -->
            <div id="userAdminContent">
                <!-- User administration will be dynamically loaded here -->
            </div>
        </div>

        <div id="dangerZone" class="user-box" style="display:none;">
            <h1>Danger Zone</h1>
            <hr class="big-separator">
            <div id="dangerZoneContent">
                <button id="notifyDutyUsersButton">Notify users on duty today</button>
                <button id="deleteTimetablesButton">Delete all timetables</button>
                <button id="assignDutyGroupsButton">Assign Duty Groups to Timetable</button>
            </div>
        </div>

    </body>
</html>
