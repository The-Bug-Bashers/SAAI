<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <title>Nachalarmierung</title>
    <link rel="icon" href="../resources/images/favicon.png">
    <link rel="stylesheet" href="../style.css">
    <script src="additional-alarmScript.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div id="headers">
    <div id="headertextdiv">
        <h1 id="headertext">Sani-<span class="accentText">Nachalarmierung</span></h1>
    </div>
</div>
<div id="center">
    <div id="loadingMessage">Dienstplan Laden...</div>
    <div id="errorMessage" style="display:none; color:white;">Fehler beim Laden der Daten. Bitte versuche es später erneut.</div>
    <h3 style="text-align: center;" id="userInformation">Entweder neuen Alarm erstellen oder aktiven Alarm auswählen!</h3>


    <div class="alerting" id='newAlertDiv'>
        <h1 style="border-bottom: 0px solid #fdbbd5; margin-top: 0">Neuen Alarm erstellen</h1>
        <form id="alertform" onsubmit="return false;" style="display:none;">
            <div>

                <p style="margin: 1vmin">Verletzung</p>
                <div class="input-group">
                    <input required type="text" name="text" autocomplete="off" class="input" id="description">
                    <label class="user-label">Beschreibung</label>
                </div>

                <p style="margin: 1vmin">Ort</p>

                <div id="roomInputs">
                    <div class="input-group">
                        <input type="text" name="text" autocomplete="off" class="input" id="roomNumber">
                        <label class="user-label">Nr.</label>
                    </div>

                    <div class="input-group">
                        <input required type="text" name="text" autocomplete="off" class="input" id="room">
                        <label class="user-label">Raum</label>
                    </div>
                </div>
            </div>
            <!-- Button below form -->
            <button type="button" id="formWeiterButton" class="button">Weiter</button>
        </form>
    </div>
    <div class="alerting" id="activeAlarms">
        <h1 style="border-bottom: 0px solid #fdbbd5; margin-top: 0">Aktive Alarme</h1>

    </div>
</div>

<!-- User selection section -->
<div id="userSelection" style="display:none;">
    <h2 style="margin-left: 25px; margin-bottom: 0;">Wähle die Sanitäter</h2>
    <div id="userList" class="timetable-row"></div> <!-- Dynamically generated user list, sorted and grouped by experience level -->
    <button type="button" id="sendAlertButton" class="button" style="margin: 25px">Alarm senden</button>
</div>
</body>
</html>
