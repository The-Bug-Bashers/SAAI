<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Schulsanitäter-Alarmierung</title>
    </head>
    <body>
        <div id="headers">
            <div id="headertextdiv">
               <h1 id="headertext">Schulsanitäter-<span class="accentText">Alarmierung</span></h1>
            </div>
        </div>
        <div id="center">
            <form id="alertform" action="javascript:sendAlert()">
                <label>Ort<br>
                    <input name="room" id="room" type="text" required><br>
                </label>
                <label>Beschreibung<br>
                    <input name="description" id="description" type="text" required><br>
                </label>
                <p id="usewarning">Nicht spaßeshalber nutzen!</p>
                <button type="submit">Alarm senden</button>
            </form>
            <div class="timetable">
                <h1>Dienstplan</h1>
                <section id="timetableContainer">
                    <!-- Timetable rows will be dynamically added here -->
                </section>
            </div>
        </div>
    </body>
</html>

<script>
    const url = 'http://172.105.246.203:8080';

    function sendAlert() {
        const data = {
            room: document.getElementById('room').value,
            description: document.getElementById('description').value,
        };

        fetch(url + '/alerts', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(jsonResponse => {
                console.log(jsonResponse);
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });

        redirect("alert-progress")
    }

    function redirect(page) {
        window.location.href = page;
    }

    function fetchTimetable() {
        //fetch(url + '/infoscreen')
        fetch('http://172.105.246.203:8080/infoscreen')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(apiResponse => {
                const timetableContainer = document.getElementById('timetableContainer');
                timetableContainer.innerHTML = '';

                apiResponse.forEach(entry => {
                    const startTime = entry.start_time;
                    const endTime = entry.end_time;
                    const responsibleUsers = entry.responsible_users;
                    const isActive = entry.is_active;

                    const timetableRow = document.createElement('div');
                    timetableRow.classList.add('timetable-row');
                    if (isActive) {
                        timetableRow.classList.add('active-timetable');
                    }

                    timetableRow.innerHTML = `
                    <div class="timetable-details">
                        <div><strong>Start:</strong> ${startTime}</div>
                        <div><strong>Ende:</strong> ${endTime}</div>
                    </div>
                    <div class="responsible-users"><strong>Dienst haben:</strong> ${responsibleUsers.join(', ')}</div>
                `;

                    timetableContainer.appendChild(timetableRow);
                });
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
            });
    }

    // Call fetchTimetable when the document is loaded
    document.addEventListener("DOMContentLoaded", function() {
        fetchTimetable();
    });
</script>
