<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Schulsanitäter-Alarmierung</title>

        <style>
            body {
                accent-color: #d32d24;
                color: white;
                font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
                font-size: 4vmin;
            }

            .timetable {
                max-width: 800px;
                margin: 5vw auto;
                background-color: #703353;
                box-shadow: 0 0 6px rgba(0, 0, 0, 1);
                border-radius: 8px;
                padding: 20px;
            }

            h1 {
                text-align: center;
                margin-bottom: 20px;
                color: white;
            }

            .timetable-row {
                padding: 25px;
                border-bottom: 3px solid #ddd;
            }

            .timetable-row:last-child {
                border-bottom: none;
            }

            .timetable-details {
                display: flex;
                justify-content: space-between;
                margin-bottom: 4px;
                padding-bottom: 4px;
                border-bottom: 1px solid #E0E0E0;
            }

            .timetable-details strong {
                font-weight: bold;
            }

            .responsible-users {
                font-size: 3vmin;
            }
        </style>

    </head>
    <body>
        <div class="timetable">
            <h1>Dienstplan</h1>
            <section id="timetableContainer">
                <!-- Timetable rows will be dynamically added here -->
            </section>
        </div>

        <script>
            const url = 'http://172.105.246.203:8080';

            function fetchTimetable() {
                fetch(url + '/infoscreen')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(apiResponse => {
                        const timetableContainer = document.getElementById('timetableContainer');
                        timetableContainer.innerHTML = '';

                        apiResponse.events.forEach(entry => {
                            const startTime = entry.start_time;
                            const endTime = entry.end_time;
                            const responsibleUsers = entry.responsible_users;
                            const isActive = entry.is_active;

                            const timetableRow = document.createElement('div');
                            timetableRow.classList.add('timetable-row');
                            if (isActive) {
                                timetableRow.classList.add('active-timetable');
                            }

                            timetableRow.innerHTML = `
                    <div class="timetable-details">
                        <div><strong>Start:</strong> ${startTime}</div>
                        <div><strong>Ende:</strong> ${endTime}</div>
                    </div>
                    <div class="responsible-users"><strong>Dienst haben:</strong> ${responsibleUsers.join(', ')}</div>
                `;

                            timetableContainer.appendChild(timetableRow);
                        });
                    })
                    .catch(error => {
                        console.error('There was a problem with the fetch operation:', error);
                    });
            }

            // Call fetchTimetable when the document is loaded
            document.addEventListener("DOMContentLoaded", function() {
                fetchTimetable();
            });
        </script>
    </body>
</html>
