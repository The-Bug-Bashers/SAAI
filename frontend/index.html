<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Schulsanitäter-Alarmierung</title>
        <link rel="icon" href="resources/images/favicon.png">

        <link rel="stylesheet" href="resources/stylesheets/general.css">
        <link rel="stylesheet" href="resources/stylesheets/box.css">
        <link rel="stylesheet" href="resources/stylesheets/modal.css">
        <link rel="stylesheet" href="resources/stylesheets/timetable.css">
        <link rel="stylesheet" href="resources/stylesheets/button.css">
        <link rel="stylesheet" href="resources/stylesheets/input.css">
        <link rel="stylesheet" href="style.css">

        <script src="resources/scripts/apiUrls.js"></script>
        <script src="resources/scripts/modal.js"></script>
        <script src="resources/scripts/timetable.js"></script>
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1 id="headerText">Schulsanitätsdienst</h1>

        <div style="display: none" id="modal" class="modal">
            <div id="modalContent" class="box"><!--used to display infos or error messages--></div>
        </div>

        <div id="warningDisplayDiv" class="warning box" style="display:none; text-align: center">
            <h2>Es könne keine Alarme verschickt werden, da im moment niemand im Dienst ist.</h2>
            <p>Wenn du die Schulsanitäter brauchst, gehe bitte zu Lernhaus 7-11 und frage dort nach den Schulsanitätern.</p>
        </div>

        <form id="alertForm" class="alerting box" onsubmit="return false;" style="display: none;">
            <h1>Alarmierung</h1>

            <h3 id="alertingErrorMessage"><!--error message gets inserted here--></h3>

            <p>Verletzung</p>
            <div class="input-group">
                <input required type="text" name="text" autocomplete="off" class="input" id="description" placeholder="">
                <label class="user-label">Beschreibung*</label>
            </div>

            <p>Ort</p>
            <div id="roomInputs">
                <div class="input-group" style="width: 15%">
                    <input type="text" name="text" autocomplete="off" class="input" id="roomNumber" placeholder="">
                    <label class="user-label">Nr.</label>
                </div>

                <div class="input-group" style="width: 83%">
                    <input required type="text" name="text" autocomplete="off" class="input" id="room" placeholder="">
                    <label class="user-label">Raum*</label>
                </div>
            </div>

            <br>
            <button class="button" id="alarmButton">Alarm senden</button>
        </form>

        <h1 id="loadingMessage" style="text-align: center">Laden...</h1>
        <div id="timetableDiv" class="timetable box" style="display: none"><!--timetable content gets added here--></div>
    </body>
</html>
