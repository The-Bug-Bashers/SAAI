<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Schulsanitäter-Alarmierung</title>
        <link rel="icon" href="favicon.png">
        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div id="headers">
            <div id="headertextdiv">
                <h1 id="headertext">Schulsanitäter-<span class="accentText">Alarmierung</span></h1>
            </div>
        </div>
        <div id="center">
            <form id="alertform" action="javascript:sendAlert()">
                <label>Ort<br>
                    <input name="room" id="room" type="text" required><br>
                </label>
                <label>Beschreibung<br>
                    <input name="description" id="description" type="text" required><br>
                </label>
                <p id="usewarning">Nicht spaßeshalber nutzen!</p>
                <button type="submit">Alarm senden</button>
            </form>
            <div class="timetable">
                    <h1>Dienstplan</h1>
                <section id="timetableContainer">
                    <!-- Timetable rows will be dynamically added here -->
                </section>
            </div>
        </div>
        <div id="elementilogodiv">
            <img src="images/element-i-logo.svg" id="elementilogo" alt="element-i">
        </div><br>
    </body>
</html>
