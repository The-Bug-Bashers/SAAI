<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display API Response</title>
</head>
<body>

<script>
    // Fetch data from the API
    fetch('https://saai.wayshare.de:9090/api/infoscreen')
        .then(response => response.json())
        .then(data => {
            // Display the response using document.write
            document.write('<pre>');
            document.write(JSON.stringify(data, null, 2));
            document.write('</pre>');
        })
        .catch(error => {
            console.error('Error fetching data:', error);
            document.write('Error fetching data.');
        });
</script>

</body>
</html>
