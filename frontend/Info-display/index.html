<!-- this is used to embed the timetable in other sites, therefore: NO IMPORTS OF OTHER FILES! -->
<!DOCTYPE html>
<head>
    <style>
        body {
            accent-color: #d32d24;
            color: #fbd8e6;
            font-size: 4vmin;
            font-family: Calibri, sans-serif;
        }

        .timetable {
            max-width: 800px;
            margin: 2vw auto;
            background-color: #57213E;
            border-color: #95375b;
            border-width: 3px;
            border-style: solid;
            border-radius: 8px;
            padding: 20px;
            display: block;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fbd8e6;
        }

        .timetable-row {
            padding: 25px;
            border-bottom: 3px solid #fbd8e6;
        }

        .timetable-row:last-child {
            border-bottom: none;
        }

        .timetable-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid #fbd8e6;
        }

        .active-timetable {
            background-color: #733556;
            color: #6ca524;
            border-radius: 8px;
        }

        .timetable-details strong {
            font-weight: bold;
        }

        .responsible-users {
            font-size: 3vmin;
        }
    </style>
    <!-- Include jQuery from CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title></title>
</head>
<body>
<div class="timetable">
    <h1>Dienstplan</h1>
    <section id="timetableContainer">
        <!-- Timetable rows will be dynamically added here -->
    </section>
</div>
<script type="text/javascript">
    jQuery(document).ready(function($) {
        const url = 'https://saai.wayshare.de:9090';

        function fetchTimetable() {
            $.getJSON(url + '/api/infoscreen')
                .done(function(response) {
                    const timetableContainer = $('#timetableContainer');
                    timetableContainer.empty();

                    $.each(response.events, function(index, entry) {
                        const startTime = entry.start_time;
                        const endTime = entry.end_time;
                        const responsibleUsers = entry.responsible_users;
                        const isActive = entry.is_active;

                        const timetableRow = $('<div>', { class: 'timetable-row' });
                        if (isActive) {
                            timetableRow.addClass('active-timetable');
                        }

                        const detailsDiv = $('<div>', { class: 'timetable-details' });
                        detailsDiv.append($('<div>').html('<strong>Start:</strong> ' + startTime));
                        detailsDiv.append($('<div>').html('<strong>Ende:</strong> ' + endTime));

                        const usersDiv = $('<div>', { class: 'responsible-users' });
                        usersDiv.html('<strong>Dienst haben:</strong> ' + responsibleUsers.join(', '));

                        timetableRow.append(detailsDiv);
                        timetableRow.append(usersDiv);

                        timetableContainer.append(timetableRow);
                    });
                })
                .fail(function(jqXHR, textStatus, errorThrown) {
                    console.error('There was a problem with the fetch operation:', textStatus, errorThrown);
                });
        }

        fetchTimetable();
    });
</script>
</body>
</html>
