<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API GET Response Display</title>
</head>
<body>
<h1>API GET Response Display</h1>
<button onclick="fetchApiResponse()">Get API Response</button>
<div id="apiResponse"></div>

<script>
    async function fetchApiResponse() {
        try {
            const response = await fetch('http://172.105.246.203:9090/infoscreen', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            const data = await response.json();
            document.getElementById('apiResponse').innerText = JSON.stringify(data, null, 2);
        } catch (error) {
            console.error('There has been a problem with your fetch operation:', error);
            document.getElementById('apiResponse').innerText = 'Error: ' + error.message;
        }
    }
</script>
</body>
</html>
